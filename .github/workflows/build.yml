name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (mixer, microphone choice, config)
        run: python3 -m unittest discover -v linux/tests
      - name: Package
        run: |
          python3 -m py_compile linux/recpill.py
          bash scripts/package.sh linux linux/recpill.py dist
      - name: Installer smoke test (fake HOME)
        run: |
          set -e
          (cd dist && sha256sum recpill-linux.tar.gz > SHA256SUMS)
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          RECPILL_BASE_URL="file://$PWD/dist" sh install.sh || true
          test -x "$HOME/.local/bin/recpill"
          "$HOME/.local/bin/recpill" version
          sh install.sh --uninstall
          test ! -e "$HOME/.local/bin/recpill"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/recpill-linux.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + unit tests
        shell: powershell
        run: ./windows/build.ps1 -Test -Zip
      - name: Installer smoke test (sandboxed LOCALAPPDATA and Start menu)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sand = Join-Path $env:RUNNER_TEMP 'sand'
          New-Item -ItemType Directory -Force "$sand\lad", "$sand\menu" | Out-Null
          $env:LOCALAPPDATA = "$sand\lad"
          $env:RECPILL_START_MENU = "$sand\menu"
          $env:RECPILL_BASE_URL = ([Uri](Resolve-Path windows\dist).Path).AbsoluteUri
          $env:RECPILL_OUTPUT = "$sand\calls"
          iex (Get-Content windows\install.ps1 -Raw)
          if (-not (Test-Path "$sand\lad\RecPill\RecPill.exe")) { throw 'RecPill.exe was not installed' }
          if (@(Get-ChildItem "$sand\menu" -Filter *.lnk).Count -ne 3) { throw 'expected 3 shortcuts' }
          iex (Get-Content windows\uninstall.ps1 -Raw)
          if (Test-Path "$sand\lad\RecPill") { throw 'uninstall left files behind' }
          if (@(Get-ChildItem "$sand\menu" -Filter *.lnk).Count -ne 0) { throw 'uninstall left shortcuts behind' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: windows/dist/RecPill-win-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: |
          swiftc -O -swift-version 5 macos/Core.swift macos/Tests/main.swift -o tests-mac
          ./tests-mac
      - name: Build (arm64 + x86_64), ad-hoc sign
        run: |
          mkdir -p dist
          for arch in arm64 x86_64; do
            swiftc -O -swift-version 5 -target "$arch-apple-macos14.2" macos/Core.swift macos/main.swift \
              -o "dist/recpill-$arch" \
              -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __info_plist -Xlinker macos/Info.plist
          done
          lipo -create -output dist/recpill dist/recpill-arm64 dist/recpill-x86_64
          codesign --force -s - --identifier dev.maxjustships.recpill dist/recpill
          file dist/recpill
          ./dist/recpill version
          bash scripts/package.sh macos dist/recpill dist
      - name: Smoke run on the CI runner (informational: runners have no real audio hardware or permissions)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          ./dist/recpill start --quiet --output "$RUNNER_TEMP/rp" || true
          sleep 4
          ./dist/recpill status || true
          ./dist/recpill stop --quiet || true
          echo "--- log"; cat "$HOME/Library/Application Support/RecPill/recpill.log" || true
          ls -la "$RUNNER_TEMP/rp" || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/recpill-macos.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Collect files + checksums
        run: |
          mkdir -p release
          cp artifacts/* release/
          cp windows/install.ps1 windows/uninstall.ps1 install.sh release/
          cd release && sha256sum RecPill-win-x64.zip recpill-linux.tar.gz recpill-macos.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "RecPill $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --verify-tag
